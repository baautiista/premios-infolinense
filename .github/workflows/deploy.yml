name: Desplegar en Cloudflare

# Despliegue manual: Actions → «Desplegar en Cloudflare» → Run workflow.
# Requiere los secretos del repositorio CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Aplicar migraciones de base de datos antes de desplegar"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --no-warnings --test --test-concurrency=1 tests/*.test.mjs
      - name: Punto de restauración previo (D1 Time Travel)
        if: ${{ inputs.migrate }}
        run: npx wrangler d1 time-travel info premios-infolinense
      - name: Migraciones
        if: ${{ inputs.migrate }}
        run: npx wrangler d1 migrations apply premios-infolinense --remote
      - name: Despliegue
        run: npx wrangler deploy
