# Premios InfoLinense — Cloudflare Workers
# Antes del primer despliegue: crea la base de datos y el bucket (ver docs/DESPLIEGUE.md)
# y sustituye database_id por el identificador que te devuelva Cloudflare.
name = "premios-infolinense"
main = "dist/worker/index.js"
compatibility_date = "2025-09-01"
no_bundle = true
workers_dev = true

# El dominio premios.infolinense.com se añade en el despliegue (variable CUSTOM_DOMAIN de GitHub)
# cuando infolinense.com esté gestionado desde Cloudflare. Mientras, la web usa la dirección *.workers.dev.

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "premios-infolinense"
database_id = "REEMPLAZAR_CON_EL_ID_DE_D1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "premios-infolinense-media"

[vars]
ENVIRONMENT = "production"
# SITE_URL y TURNSTILE_SITE_KEY se inyectan en el despliegue desde las variables de GitHub.
# Si SITE_URL no se define, se usa la dirección desde la que se visita la web.

# Secretos (NO se guardan aquí). Crear con:
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put VOTE_PEPPER
#   npx wrangler secret put SESSION_SECRET

[observability]
enabled = true
